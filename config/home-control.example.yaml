home_assistant:
  base_url: "http://homeassistant.local:8123"
  token_env: "HOME_ASSISTANT_TOKEN"
  timeout_seconds: 8

server:
  api_token_env: "HOME_CONTROL_API_TOKEN"
  log_path: ".cache/home_control/events.jsonl"
  min_api_token_length: 32

udp_events:
  enabled: false
  host: "127.0.0.1"
  port: 7000
  event_type: "home_control_magic"

faults:
  enabled: false
  enabled_env: "HOME_CONTROL_FAULT_MODE"
  rules:
    # Fault injection is ignored unless both faults.enabled is true and HOME_CONTROL_FAULT_MODE=1.
    - match:
        source: "dify"
        action_id: "light_off"
      scenario: "fail_once_then_success"
      message: "simulated transient failure"
    - match:
        source: "dify"
        action_id: "light_on"
        request_id_prefix: "e2e-confirm"
      scenario: "confirmation_required"
      message: "simulated confirmation required"

actions:
  light_on:
    label: "照明をつける"
    ha_script: "script.demo_light_on"
    confirm_required: false
    response_text: "照明をつける操作を送信しました。実際の点灯状態は外部観測で確認してください。"
    control_type: "stateless_toggle"
    state_authority: "open_loop"
    verification:
      mode: "external_observation"
    expected_effect:
      domain: "light"
      service: "turn_on"
      entity_id: "light.demo_room"
      expected_state: "on"

  light_off:
    label: "照明を消す"
    ha_script: "script.demo_light_off"
    confirm_required: false
    response_text: "照明を消す操作を送信しました。実際の消灯状態は外部観測で確認してください。"
    control_type: "stateless_toggle"
    state_authority: "open_loop"
    verification:
      mode: "external_observation"
    expected_effect:
      domain: "light"
      service: "turn_off"
      entity_id: "light.demo_room"
      expected_state: "off"

  curtain_close:
    label: "カーテンを閉める"
    ha_script: "script.curtain_close"
    confirm_required: true
    response_text: "カーテンを閉めました。"
    control_type: "position_command"
    state_authority: "submitted_only"
    verification:
      mode: "command_ack_only"

    # If a later read-only review and ticketed execute/wait proof show this
    # cover entity reports stable state plus current_position, switch to a
    # position-aware post-state check. Closed proof should require both the
    # expected state and current_position below a conservative threshold:
    #
    # state_authority: "ha_entity"
    # verification:
    #   mode: "ha_state"
    #   accepted_states: ["closed"]
    #   settle_seconds: 8
    #   timeout_seconds: 60
    #   position:
    #     attribute: "current_position"
    #     max: 5
    # expected_effect:
    #   domain: "cover"
    #   service: "close_cover"
    #   entity_id: "cover.demo_curtain"
    #   expected_state: "closed"
    #
    # Open/restore proof should use a separate action with expected_state:
    # "open" and position.min such as 95 after the local device is reviewed.

  vacuum_return:
    label: "掃除機を充電台に戻す"
    ha_script: "script.demo_vacuum_return"
    confirm_required: true
    response_text: "掃除機を充電台に戻しました。"
    control_type: "job_command"
    state_authority: "ha_entity"
    verification:
      mode: "ha_state"
      accepted_states: ["docked"]
      settle_seconds: 10
      timeout_seconds: 75
    expected_effect:
      domain: "vacuum"
      service: "return_to_base"
      # Track the script target entity only. Do not use all vacuum domain counts
      # when Home Assistant exposes local and cloud entities for one appliance.
      entity_id: "vacuum.demo_cloud_target"
      expected_state: "docked"

  # Demo-only air conditioner candidates. Do not add expected_effect to an
  # unknown switch wrapper just to make CheckState green. If a same-device
  # climate entity is available, keep the service call inside a Home Assistant
  # script and track the climate entity as a separate mode_command action.
  aircon_cool:
    label: "エアコンを冷房にする"
    ha_script: "script.demo_aircon_cool"
    confirm_required: true
    response_text: "エアコンを冷房にしました。"
    control_type: "mode_command"
    state_authority: "ha_entity"
    verification:
      mode: "ha_state"
      accepted_states: ["cool"]
      settle_seconds: 5
      timeout_seconds: 60
    expected_effect:
      domain: "climate"
      service: "set_hvac_mode"
      entity_id: "climate.demo_aircon"
      expected_state: "cool"

  aircon_hvac_off:
    label: "エアコンを停止する"
    ha_script: "script.demo_aircon_hvac_off"
    confirm_required: true
    response_text: "エアコンを停止しました。"
    control_type: "mode_command"
    state_authority: "ha_entity"
    verification:
      mode: "ha_state"
      accepted_states: ["off"]
      settle_seconds: 5
      timeout_seconds: 60
    expected_effect:
      domain: "climate"
      service: "set_hvac_mode"
      entity_id: "climate.demo_aircon"
      expected_state: "off"

  projection_mode:
    label: "プロジェクションモードにする"
    ha_script: "script.projection_mode"
    confirm_required: true
    response_text: "プロジェクションモードにしました。"
    control_type: "stateless_command"
    state_authority: "submitted_only"
    verification:
      mode: "command_ack_only"
