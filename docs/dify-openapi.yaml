openapi: 3.1.0
info:
  title: Home Control Safety Bridge
  version: 0.1.1
  description: >
    Local HTTP bridge for Dify/AITuberKit/sword-voice-agent. It only exposes
    configured action_id values and internally calls Home Assistant
    /api/services/script/turn_on.
servers:
  - url: http://127.0.0.1:8787
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Check bridge and Home Assistant connectivity
      security: []
      responses:
        "200":
          description: Health result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /actions:
    get:
      summary: List allowlisted actions
      responses:
        "200":
          description: Public action summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionSummary"
  /actions/{action_id}/preview:
    post:
      summary: Preview an allowlisted action without executing it
      parameters:
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "200":
          description: Preview result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "401":
          description: Missing or invalid token
        "404":
          description: Action is not allowlisted
  /actions/{action_id}/state:
    get:
      summary: Read the Home Assistant state for an action expected effect without exposing entity ids
      parameters:
        - $ref: "#/components/parameters/ActionId"
      responses:
        "200":
          description: Redacted state-check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionStateResponse"
        "401":
          description: Missing or invalid token
        "404":
          description: Action is not allowlisted
  /actions/{action_id}/execute:
    post:
      summary: Execute an allowlisted action through Home Assistant script.turn_on
      parameters:
        - $ref: "#/components/parameters/ActionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "200":
          description: Execution result. ok=false means Home Assistant failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
        "401":
          description: Missing or invalid token
        "404":
          description: Action is not allowlisted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ActionId:
      name: action_id
      in: path
      required: true
      schema:
        type: string
      examples:
        light_on:
          value: light_on
        door_close:
          value: door_close
        vacuum_return:
          value: vacuum_return
  schemas:
    HealthResponse:
      type: object
      required: [ok, status, home_assistant, actions_count, fault_mode, fault_rules_count]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [ok, degraded, config_error]
        home_assistant:
          type: object
          additionalProperties: true
        actions_count:
          type: integer
        fault_mode:
          type: boolean
          description: Always false on unauthenticated health responses; fault injection state is not disclosed.
        fault_rules_count:
          type: integer
          description: Always 0 on unauthenticated health responses; configured rule count is not disclosed.
    ActionSummary:
      type: object
      required: [action_id, label, confirm_required, response_text, control_type, state_authority, verification_mode, state_tracking]
      properties:
        action_id:
          type: string
        label:
          type: string
        confirm_required:
          type: boolean
        response_text:
          type: string
        control_type:
          type: string
          enum: [stateful_target, stateless_toggle, stateless_command, position_command, mode_command, job_command, script_wrapper]
          description: Appliance/control behavior class.
        state_authority:
          type: string
          enum: [ha_entity, ha_inferred, external_sensor, manual, open_loop, submitted_only, unknown]
          description: Source of state authority. Inferred or open-loop state is not physical proof.
        verification_mode:
          type: string
          enum: [ha_state, external_observation, command_ack_only, manual_confirmation, unsupported]
          description: Proof layer expected for this action.
        state_tracking:
          type: string
          enum: [tracked, external_required, ack_only, manual_required, unsupported]
          description: Whether this action can produce Home Assistant state proof.
        verification:
          $ref: "#/components/schemas/Verification"
          nullable: true
        expected_effect:
          $ref: "#/components/schemas/ExpectedEffect"
          nullable: true
        position_proof:
          $ref: "#/components/schemas/PositionProof"
          nullable: true
          description: Optional position threshold required in addition to accepted state for cover/door proof.
        expected_states:
          type: array
          items:
            type: string
          description: States that count as HA-state proof for this action. Includes expected_effect.expected_state when tracked.
        settle_seconds:
          type: number
          format: float
          description: Suggested wait before post-action state read. Metadata only, not proof by itself.
        timeout_seconds:
          type: number
          format: float
          description: Suggested maximum wait window for ticketed state proof. Metadata only, not proof by itself.
    ActionRequest:
      type: object
      properties:
        source:
          type: string
          default: dify
        request_id:
          type: string
        user_text:
          type: string
        dry_run:
          type: boolean
          default: false
        confirmed:
          type: boolean
          default: false
        confirmation_token:
          type: string
          nullable: true
          description: One-time token returned by preview/blocked execute for confirm_required actions.
    ActionStateResponse:
      type: object
      required: [ok, action_id, status]
      properties:
        ok:
          type: boolean
          description: True only when actual_state matches expected_state or one of expected_states, and any configured position threshold also matches.
        action_id:
          type: string
        status:
          type: string
          enum: [matched, mismatch, untracked, unavailable, position_unavailable, external_required, ack_only, manual_required, unsupported]
        control_type:
          type: string
          nullable: true
        state_authority:
          type: string
          nullable: true
        verification_mode:
          type: string
          nullable: true
        state_tracking:
          type: string
          nullable: true
        expected_state:
          type: string
          nullable: true
        expected_states:
          type: array
          items:
            type: string
          description: States accepted for the HA-state proof check.
        actual_state:
          type: string
          nullable: true
        position_attribute:
          type: string
          nullable: true
          description: HA state attribute used for position proof, usually current_position.
        expected_position_min:
          type: number
          format: float
          nullable: true
          description: Inclusive minimum accepted position.
        expected_position_max:
          type: number
          format: float
          nullable: true
          description: Inclusive maximum accepted position.
        actual_position:
          type: number
          format: float
          nullable: true
          description: Redacted numeric position read from the target entity attributes.
        position_status:
          type: string
          enum: [matched, mismatch, unavailable]
          nullable: true
          description: Result of the configured position threshold check.
    ActionResponse:
      type: object
      required: [ok, action_id, executed, status, confirmation_required, message, speak]
      properties:
        ok:
          type: boolean
        action_id:
          type: string
          description: Allowlisted action name, not the per-execution correlation id.
        executed:
          type: boolean
        status:
          type: string
          enum: [preview, confirmation_required, dry_run, duplicate, submitted, failed]
        confirmation_required:
          type: boolean
        message:
          type: string
        speak:
          type: string
        request_id:
          type: string
          nullable: true
        execution_id:
          type: string
          format: uuid
          nullable: true
          description: Per-execution correlation id issued when the bridge attempts a Home Assistant command.
        issued_at:
          type: string
          format: date-time
          nullable: true
          description: UTC timestamp for the Home Assistant command attempt.
        domain:
          type: string
          nullable: true
          description: Expected-effect domain configured for later observation correlation.
        service:
          type: string
          nullable: true
          description: Expected-effect service configured for later observation correlation.
        entity_id:
          type: string
          nullable: true
          description: Expected-effect entity configured for later observation correlation.
        expected_state:
          type: string
          nullable: true
          description: Expected state configured for later observation correlation. This is not an observed label.
        control_type:
          type: string
          nullable: true
          description: Appliance/control behavior class.
        state_authority:
          type: string
          nullable: true
          description: Source of state authority. Inferred or open-loop state is not physical proof.
        verification_mode:
          type: string
          nullable: true
          description: Proof layer expected for this action.
        state_tracking:
          type: string
          nullable: true
          description: Whether this action can produce Home Assistant state proof.
        expected_effect:
          $ref: "#/components/schemas/ExpectedEffect"
          nullable: true
        position_proof:
          $ref: "#/components/schemas/PositionProof"
          nullable: true
        expected_states:
          type: array
          items:
            type: string
          description: States that count as HA-state proof for this action.
        settle_seconds:
          type: number
          format: float
          description: Suggested wait before post-action state read. Metadata only, not proof by itself.
        timeout_seconds:
          type: number
          format: float
          description: Suggested maximum wait window for ticketed state proof. Metadata only, not proof by itself.
        confirmation_token:
          type: string
          nullable: true
          description: One-time confirmation token for confirm_required actions.
        preview:
          type: object
          nullable: true
          additionalProperties: true
        error:
          type: string
          nullable: true
          description: Generic error code. Internal Home Assistant details are not returned.
    Verification:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ha_state, external_observation, command_ack_only, manual_confirmation, unsupported]
        accepted_states:
          type: array
          items:
            type: string
          description: Additional HA states accepted as proof; expected_effect.expected_state is included separately.
        settle_seconds:
          type: number
          format: float
          description: Suggested wait before post-action state read.
        timeout_seconds:
          type: number
          format: float
          description: Suggested maximum wait window for ticketed state proof.
        position:
          $ref: "#/components/schemas/PositionProof"
          nullable: true
          description: Optional inclusive numeric position threshold required in addition to accepted state.
    PositionProof:
      type: object
      required: [attribute]
      properties:
        attribute:
          type: string
          default: current_position
        min:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 100
        max:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 100
    ExpectedEffect:
      type: object
      required: [domain, service, entity_id, expected_state]
      properties:
        domain:
          type: string
        service:
          type: string
        entity_id:
          type: string
        expected_state:
          type: string
